    <!-- BottomNavBar -->
    <div class="fixed bottom-4 left-0 w-full px-margin-mobile z-50 md:hidden">
      <a href="https://wa.me/5491131389795" target="_blank" rel="noopener" class="w-full block text-center bg-primary text-on-primary font-button text-button py-4 rounded shadow-lg active:scale-95 transition-transform">
        PEDIR CITA

    <script type="module">
      import { fetchNovedad, esc, formatFecha } from "./src/js/novedades.js";

      const container = document.getElementById("novedad-content");
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");

      function renderNotFound() {
        container.innerHTML = `
          <p class="font-body-md text-body-md text-on-surface-variant text-sm">No encontramos esta novedad.</p>
          <a href="novedades.html" class="font-button text-button text-primary uppercase">Ver todas las novedades</a>`;
      }

      // Render mínimo de Portable Text: soporta bloques normal/h2/h3, listas e imágenes.
      function renderBlock(block) {
        if (block._type === "image" && block.asset) {
          const url = typeof block.asset === "string" ? block.asset : block.asset.url;
          return url ? `<img src="${esc(url)}?w=760&auto=format" alt="" loading="lazy" class="w-full border border-surface-border">` : "";
        }
        if (block._type !== "block") return "";
        const text = (block.children || []).map((c) => esc(c.text)).join("");
        switch (block.style) {
          case "h2":
            return `<h2 class="font-headline-md text-headline-md text-primary mt-4">${text}</h2>`;
          case "h3":
            return `<h3 class="font-button text-button text-primary uppercase mt-4">${text}</h3>`;
          default:
            return `<p class="font-body-md text-body-md text-on-surface-variant">${text}</p>`;
        }
      }

      if (!slug) {
        renderNotFound();
      } else {
        fetchNovedad(slug)
          .then((n) => {
            if (!n) {
              renderNotFound();
              return;
            }
            document.getElementById("page-title").textContent = `${n.titulo} — Dra Daniela Visentini`;
            const resumen = (n.cuerpo || [])
              .filter((b) => b._type === "block")
              .map((b) => (b.children || []).map((c) => c.text).join(""))
              .join(" ")
              .slice(0, 155);
            if (resumen) {
              document.getElementById("page-description").setAttribute("content", resumen);
              document.getElementById("page-og-description").setAttribute("content", resumen);
            }
            document.getElementById("page-canonical").setAttribute("href", `${location.origin}${location.pathname}?slug=${encodeURIComponent(slug)}`);
            document.querySelector('meta[property="og:title"]').setAttribute("content", `${n.titulo} — Dra. Daniela Visentini`);
            const cover = n.portada
              ? `<img src="${esc(n.portada)}?w=1200&auto=format" alt="" loading="lazy" class="w-full border border-surface-border">`
              : "";
            const cuerpo = (n.cuerpo || []).map(renderBlock).join("");
            const adjuntos = (n.adjuntos || []).filter((a) => a.url).map((a) => `
              <a href="${esc(a.url)}" download target="_blank" rel="noopener" class="flex items-center gap-4 p-4 border border-surface-border bg-background hover:bg-background-subtle transition-colors">
                <span class="material-symbols-outlined text-primary-container" aria-hidden="true">description</span>
                <span class="font-button text-button text-primary">${esc(a.titulo || "Descargar archivo")}</span>
              </a>`).join("");
            container.innerHTML = `
              <span class="font-label-caps text-label-caps text-on-surface-variant">${esc(formatFecha(n.fecha))}</span>
              <h1 class="font-headline-md text-headline-lg text-primary">${esc(n.titulo)}</h1>
              ${cover}
              ${cuerpo}
              ${adjuntos ? `<div class="flex flex-col gap-3 mt-4">${adjuntos}</div>` : ""}`;
          })
          .catch(() => {
            container.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant text-sm">No pudimos cargar esta novedad en este momento.</p>`;
          });
      }
    </script>
  </body></html>
