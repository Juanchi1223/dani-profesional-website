    <script type="module">
      import { fetchNovedades, renderCard, renderSkeletonCard, renderError } from "./src/js/novedades.js";

      const grid = document.getElementById("novedades-grid");
      grid.innerHTML = Array(6).fill(renderSkeletonCard()).join("");
      fetchNovedades(50)
        .then((items) => {
          if (!items || items.length === 0) {
            grid.innerHTML = renderError("Todavía no hay novedades publicadas.");
            return;
          }
          grid.innerHTML = items.map(renderCard).join("");
        })
        .catch(() => {
          grid.innerHTML = renderError("No pudimos cargar las novedades en este momento.");
        });
    </script>
